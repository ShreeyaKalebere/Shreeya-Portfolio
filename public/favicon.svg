<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#050807" />
  <rect x="2" y="2" width="60" height="60" rx="10" fill="none" stroke="#00ff66" stroke-width="2" stroke-opacity="0.6" />
  <!-- Isometric Voxel 'S' Cube Design -->
  <!-- Top Face -->
